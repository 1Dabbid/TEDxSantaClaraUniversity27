name: CI

on:
  push:
  pull_request:

# Third-party actions are pinned to full commit SHAs (the tag in the comment is what the
# SHA was resolved from), so a moved or compromised tag cannot change what runs here.
# To update: look up the new tag's commit (git ls-remote --tags https://github.com/actions/<name>)
# and replace both the SHA and the comment.

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Installs the Chromium build that matches the pinned @playwright/test version.
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds the site and serves it (npm run build && npm run start).
      - run: npm run test:e2e
      - name: Upload the HTML report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
