eventName: TEDxSantaClaraUniversity
themeName: Fine Print
themeTagline: The overlooked details that end up deciding everything.
themeStory: |-
  Every agreement has a part nobody reads. The clause in small type, the footnote, the asterisk. It is easy to skip, and it is usually where the outcome was decided all along.

  Fine Print is an evening about those details. The quiet decisions, unexamined assumptions and small mechanisms that shape our work, our communities and our lives long before anyone notices them.

  Speakers will be announced soon. Until then, consider this the first clause.
