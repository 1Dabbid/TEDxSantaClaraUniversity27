notes:
  - Amounts are per academic year.
  - Every tier can be adjusted to suit your organization.
  - Custom and in-kind partnerships are welcome, for example catering, printing, AV equipment, photography or videography, and gifts for speakers and volunteers.
  - Commit by March 1, 2027 to appear on the talk videos, signage and printed materials.
  - Partners receive an impact report by May 8, 2027.
